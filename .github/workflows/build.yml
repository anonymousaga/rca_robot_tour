name: Publish packages on release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
    build_win64:
        name: Build win64 binary
        runs-on: windows-latest
        defaults:
          run:
            shell: bash
        steps:
          - uses: actions/checkout@main
            with:
              ref: main
    
          - uses: actions/setup-python@main
            with:
              cache: 'pip'
              python-version: '3.12'
    
          - name: Install dependencies
            run: |
              python -m pip install --upgrade pip
              pip install --upgrade cx_Freeze pyperclip toml
    
          - name: Freeze app
            run: cxfreeze bdist_msi
            
          - name: Upload to release
            run: |
                mv dist/*.msi dist/RCAInstaller_win_x64.msi
                gh release upload ${{github.event.release.tag_name}} dist/*.msi
            env:
              GITHUB_TOKEN: ${{ github.TOKEN }}
    build_winarm64:
        name: Build win arm64 binary
        runs-on: windows-11-arm
        defaults:
          run:
            shell: bash
        steps:
          - uses: actions/checkout@main
            with:
              ref: main
    
          - uses: actions/setup-python@main
            with:
              cache: 'pip'
              python-version: '3.12'
    
          - name: Install dependencies
            run: |
              python -m pip install --upgrade pip
              pip install --upgrade cx_Freeze pyperclip toml
    
          - name: Freeze app
            run: cxfreeze bdist_msi
            
          - name: Upload to release
            run: |
                mv dist/*.msi dist/RCAInstaller_win_arm64.msi
                gh release upload ${{github.event.release.tag_name}} dist/*.msi
            env:
              GITHUB_TOKEN: ${{ github.TOKEN }}
    build_macarm64:
        name: Build mac arm64 binary
        runs-on: macos-latest
        defaults:
          run:
            shell: bash
        steps:
          - uses: actions/checkout@main
            with:
              ref: main
    
          - uses: actions/setup-python@main
            with:
              cache: 'pip'
              python-version: '3.12'
    
          - name: Install dependencies
            run: |
              python -m pip install --upgrade pip
              pip install --upgrade cx_Freeze pyperclip toml
    
          - name: Freeze app
            run: cxfreeze bdist_dmg
            
          - name: Upload to release
            run: |
                mv 'build/Robot Coaching Assistant Installer.dmg' 'build/RCAInstaller_mac_arm64.dmg'
                gh release upload ${{github.event.release.tag_name}} 'build/RCAInstaller_mac_arm64.dmg'
            env:
                  GITHUB_TOKEN: ${{ github.TOKEN }}
    build_linux64:
        name: Build linux binary x64
        runs-on: ubuntu-latest
        defaults:
          run:
            shell: bash
        steps:
          - uses: actions/checkout@main
            with:
              ref: main
    
          - uses: actions/setup-python@main
            with:
              cache: 'pip'
              python-version: '3.12'
    
          - name: Install dependencies
            run: |
              python -m pip install --upgrade pip
              pip install --upgrade cx_Freeze pyperclip toml
    
          - name: Freeze app
            run: cxfreeze bdist_appimage
            
          - name: Upload to release
            run: |
                mv dist/*.AppImage dist/RCAInstaller_linux_x64.AppImage
                gh release upload "${{ github.event.release.tag_name }}" dist/*.AppImage
            env:
              GITHUB_TOKEN: ${{ github.TOKEN }}
    build_linuxarm64:
        name: Build linux binary arm64
        runs-on: ubuntu-24.04-arm
        defaults:
          run:
            shell: bash
        steps:
          - uses: actions/checkout@main
    
            with:
              ref: main
          - uses: actions/setup-python@main
            with:
              cache: 'pip'
              python-version: '3.12'
    
          - name: Install dependencies
            run: |
              python -m pip install --upgrade pip
              pip install --upgrade cx_Freeze pyperclip toml
    
          - name: Freeze app
            run: cxfreeze bdist_appimage
            
          - name: Upload to release
            run: |
                mv dist/*.AppImage dist/RCAInstaller_linux_arm64.AppImage
                gh release upload "${{ github.event.release.tag_name }}" dist/*.AppImage
            env:
              GITHUB_TOKEN: ${{ github.TOKEN }}

    publish_homebrew:
        name: Publish Homebrew cask
        needs:
          - build_macarm64
        runs-on: macos-latest
        defaults:
          run:
            shell: bash
        steps:
          - name: Download macOS release asset
            run: |
              gh release download "${{ github.event.release.tag_name }}" \
                --repo "${{ github.repository }}" \
                --pattern 'RCAInstaller_mac_arm64.dmg' \
                --dir "$RUNNER_TEMP"
            env:
              GH_TOKEN: ${{ github.TOKEN }}

          - name: Check out Homebrew tap
            uses: actions/checkout@main
            with:
              repository: anonymousaga/homebrew-tap
              token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
              path: homebrew-tap

          - name: Update cask
            working-directory: homebrew-tap
            env:
              RELEASE_TAG: ${{ github.event.release.tag_name }}
            run: |
              version="${RELEASE_TAG#v}"
              sha256="$(shasum -a 256 "$RUNNER_TEMP/RCAInstaller_mac_arm64.dmg" | cut -d ' ' -f 1)"
              mkdir -p Casks
              cat > Casks/robot-coaching-assistant.rb <<EOF
              cask "robot-coaching-assistant" do
                version "${version}"
                sha256 "${sha256}"

                url "https://github.com/anonymousaga/rca_robot_tour/releases/download/${RELEASE_TAG}/RCAInstaller_mac_arm64.dmg"
                name "Robot Coaching Assistant"
                desc "Tool to simulate a robot's path for Science Olympiad robot tour"
                homepage "https://github.com/anonymousaga/rca_robot_tour"

                depends_on arch: :arm64

                app "Robot Coaching Assistant.app"
              end
              EOF

          - name: Commit and push cask
            working-directory: homebrew-tap
            env:
              RELEASE_TAG: ${{ github.event.release.tag_name }}
            run: |
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add Casks/robot-coaching-assistant.rb
              if git diff --cached --quiet; then
                echo "Cask is already up to date."
                exit 0
              fi
              git commit -m "Update Robot Coaching Assistant to ${RELEASE_TAG#v}"
              git push origin HEAD:main
